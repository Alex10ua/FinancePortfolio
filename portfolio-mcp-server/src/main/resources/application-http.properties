# Streamable HTTP mode — activated with SPRING_PROFILES_ACTIVE=http.
#
# This is what the docker-compose `portfolio-mcp` service runs: a long-lived
# server an MCP client connects to over HTTP, rather than a subprocess it spawns.
# The stdio form still works from the same image; it is the default profile.

spring.ai.mcp.server.stdio=false
# STREAMABLE is the current transport; SSE is deprecated in Spring AI 2.x and
# STATELESS drops session support that the client expects.
spring.ai.mcp.server.protocol=STREAMABLE
spring.ai.mcp.server.streamable-http.mcp-endpoint=/mcp

# Tomcat is needed here, unlike stdio mode.
spring.main.web-application-type=servlet
server.port=${MCP_HTTP_PORT:8081}
# Binds all interfaces *inside the container*; what actually reaches the network
# is decided by the compose port mapping, which publishes on 127.0.0.1 only.
server.address=0.0.0.0

# stdout is free in this mode (nothing speaks JSON-RPC on it), but logging still
# goes to stderr via logback-spring.xml so `docker logs` behaves the same either way.

# The endpoint has NO authentication of its own. Anyone who can reach the port
# gets read access to every portfolio this server's account owns, so the compose
# mapping must stay 127.0.0.1-bound unless auth is added in front of it.
