spring.application.name=portfolio-mcp-server

# --- MCP transport -----------------------------------------------------------
# Two modes from one image:
#   default        stdio  — an MCP client spawns this as a subprocess (docker run -i)
#   --profile http HTTP   — long-lived compose service, see application-http.properties
spring.ai.mcp.server.stdio=true
spring.ai.mcp.server.name=finance-portfolio
spring.ai.mcp.server.version=0.1.0
# SYNC registers only synchronous @McpTool methods; async ones are silently
# ignored. Every tool here blocks, so keep this as SYNC.
spring.ai.mcp.server.type=SYNC

# --- stdout hygiene (stdio mode) ---------------------------------------------
# stdout carries JSON-RPC frames. A single log line on it corrupts the stream and
# the client fails with an opaque parse error, so nothing may write there: no web
# server and no banner. Log routing is in logback-spring.xml, which sends
# everything to stderr — see the comment there before changing it.
spring.main.web-application-type=none
spring.main.banner-mode=off
logging.level.root=WARN
logging.level.com.dev.alex.mcp=INFO

# --- backend connection ------------------------------------------------------
# The MCP server authenticates like any other non-browser client: Spring Security
# form login, then the JSESSIONID cookie on every request.
portfolio.api.base-url=${PORTFOLIO_API_BASE_URL:http://localhost:8080}
portfolio.api.username=${PORTFOLIO_USERNAME:}
portfolio.api.password=${PORTFOLIO_PASSWORD:}
portfolio.api.timeout-seconds=${PORTFOLIO_API_TIMEOUT_SECONDS:30}
